<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0608">
<title>404 — Nilouverse Music</title>
<link rel="icon" type="image/png" href="art/button.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Metal+Mania&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#0a0608;color:#efe6dd;font-family:'Space Grotesk',sans-serif;min-height:100svh;display:grid;place-items:center;overflow:hidden;-webkit-tap-highlight-color:transparent}
::selection{background:#ff2747;color:#0a0608}
.fog{position:fixed;inset:0;pointer-events:none;background:radial-gradient(58% 46% at 50% 44%,rgba(124,11,27,.4),transparent 70%),radial-gradient(80% 60% at 50% 120%,rgba(124,11,27,.16),transparent 70%),linear-gradient(180deg,#0a0608,#070405);transform:translate3d(calc(var(--px,0)*-10px),calc(var(--py,0)*-8px),0)}
.key{position:fixed;left:50%;top:16%;width:clamp(48px,9vw,70px);margin-left:calc(clamp(48px,9vw,70px)/-2);z-index:1;opacity:.9;filter:drop-shadow(0 0 14px rgba(255,39,71,.45));animation:keyFall 1.5s cubic-bezier(.34,1.3,.5,1) .15s both;pointer-events:none}
@keyframes keyFall{0%{transform:translateY(-60vh) rotate(-140deg);opacity:0}55%{opacity:.9}80%{transform:translateY(8px) rotate(6deg)}100%{transform:translateY(0) rotate(0)}}
.blood{position:fixed;pointer-events:none;opacity:.22;filter:drop-shadow(0 4px 12px rgba(124,11,27,.55)) saturate(1.1)}
.b1{top:8%;right:-40px;width:clamp(110px,20vw,220px);transform:rotate(16deg)}
.b2{bottom:14%;left:-50px;width:clamp(120px,22vw,240px);transform:rotate(-24deg) scaleX(-1)}
.embers{position:fixed;inset:0;overflow:hidden;pointer-events:none}
.embers span{position:absolute;bottom:-10px;border-radius:50%;background:var(--c,#ff7a1a);box-shadow:0 0 6px 1px var(--c,#ff7a1a);opacity:0;animation:rise var(--d,16s) linear infinite;animation-delay:var(--delay,0s)}
@keyframes rise{0%{transform:translateY(0);opacity:0}10%{opacity:.5}60%{opacity:.3}100%{transform:translateY(-108vh) translateX(var(--sway,16px));opacity:0}}
.treeline{position:fixed;left:0;right:0;bottom:0;height:20vh;pointer-events:none;background:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1440 320' preserveAspectRatio='none'><path fill='%23040209' d='M0,320 L0,220 L60,140 L120,240 L200,90 L280,240 L360,60 L440,240 L520,150 L600,240 L680,70 L760,240 L840,150 L920,80 L1000,240 L1080,150 L1160,120 L1240,250 L1320,160 L1440,250 L1440,320 Z'/></svg>") no-repeat bottom center/100% 100%;-webkit-mask-image:linear-gradient(180deg,transparent,#000 60%);mask-image:linear-gradient(180deg,transparent,#000 60%);transform:translate3d(calc(var(--px,0)*-16px),0,0)}
.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(125% 105% at 50% 46%,transparent 52%,rgba(0,0,0,.5) 100%)}
main{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:clamp(14px,3vh,22px);padding:24px;text-align:center;animation:fallIn 1s cubic-bezier(.2,.7,.2,1) both}
@keyframes fallIn{0%{opacity:0;transform:translateY(-52px)}55%{opacity:1}78%{transform:translateY(5px)}100%{transform:none}}
.mark{font-family:'Metal Mania',cursive;font-weight:400;font-size:clamp(6rem,26vw,11rem);line-height:.9;letter-spacing:.02em;background:linear-gradient(180deg,#fff 0%,#efe6dd 42%,#d9c6bb 68%,#e6a9a0 92%,#ff2747 130%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:1.2px rgba(124,11,27,.95);text-shadow:0 2px 22px rgba(209,20,48,.3);animation:flick 4.2s steps(1) infinite}
@keyframes flick{0%,100%{opacity:1}43%{opacity:.8}47%{opacity:.96}52%{opacity:.66}57%{opacity:.92}}
.line{color:#b7a6ab;font-size:clamp(1rem,4vw,1.25rem);line-height:1.55;max-width:26ch;letter-spacing:.02em}
.up{position:relative;overflow:hidden;margin-top:clamp(8px,2vh,16px);display:inline-flex;align-items:center;gap:10px;padding:15px 26px;border:1px solid rgba(255,39,71,.55);background:rgba(255,39,71,.08);color:#efe6dd;font-weight:700;font-size:.72rem;letter-spacing:.28em;text-transform:uppercase;text-decoration:none;clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px);transition:background .3s ease,color .3s ease,filter .3s ease,transform .3s ease}
.up::after{content:"";position:absolute;top:-60%;bottom:-60%;left:-70%;width:36%;transform:skewX(-20deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.25),transparent);transition:transform .55s ease}
.up:hover{background:#ff2747;color:#fff;filter:drop-shadow(0 0 14px rgba(255,39,71,.5));transform:translateY(-2px)}
.up:hover::after{transform:translateX(420%) skewX(-20deg)}
.up:focus-visible{outline:2px solid #ff2747;outline-offset:3px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.key{opacity:.9}}
</style>
</head>
<body>
<div class="fog" aria-hidden="true"></div>
<img class="key" src="art/button.png" alt="" aria-hidden="true">
<img class="blood b1" src="art/blood.png" alt="" aria-hidden="true">
<img class="blood b2" src="art/blood.png" alt="" aria-hidden="true">
<div class="embers" aria-hidden="true">
<span style="left:10%;width:2px;height:2px;--d:15s;--delay:-2s;--sway:14px"></span>
<span style="left:26%;width:3px;height:3px;--d:19s;--delay:-9s;--sway:-12px;--c:#ffb24d"></span>
<span style="left:44%;width:2px;height:2px;--d:13s;--delay:-5s;--sway:18px"></span>
<span style="left:62%;width:2px;height:2px;--d:21s;--delay:-13s;--sway:-16px;--c:#ff2d7e"></span>
<span style="left:78%;width:3px;height:3px;--d:16s;--delay:-7s;--sway:12px;--c:#ffb24d"></span>
<span style="left:90%;width:2px;height:2px;--d:18s;--delay:-11s;--sway:-10px"></span>
</div>
<div class="treeline" aria-hidden="true"></div>
<div class="vignette" aria-hidden="true"></div>
<main>
<h1 class="mark">404</h1>
<p class="line">You’ve been fallen, and it’s a long way down.</p>
<a class="up" href="/">↑ Back to the surface</a>
</main>
<script>
(function(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches||!matchMedia('(hover:hover) and (pointer:fine)').matches)return;
  var raf=null,x=0,y=0;
  addEventListener('pointermove',function(e){
    x=(e.clientX/innerWidth-.5)*2;y=(e.clientY/innerHeight-.5)*2;
    if(raf)return;
    raf=requestAnimationFrame(function(){document.body.style.setProperty('--px',x.toFixed(2));document.body.style.setProperty('--py',y.toFixed(2));raf=null;});
  },{passive:true});
})();
</script>
</body>
</html>
