<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#050203" />
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
<title>·</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Metal+Mania&family=Creepster&family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">

<style>
:root{
  --ink:#050203; --glass:#0b0608;
  --blood:#b3102a; --blood-deep:#5e0814; --blood-bright:#ff2747; --blood-wet:#7c0b1b;
  --violet:#b07cff;
  --bone:#efe6dd; --bone-dim:#b7aaa2; --bone-faint:#948a7c;
  --paper:#e7dccb; --paper-2:#cdbfa9; --inkpage:#241712;
  --line:rgba(239,230,221,.12);
  --ease:cubic-bezier(.22,.61,.36,1);
  --f-logo:'Metal Mania',cursive; --f-egg:'Creepster',cursive;
  --f-serif:'Instrument Serif',serif; --f-body:'Space Grotesk',sans-serif;
  --px:0; --py:0;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--ink);color:var(--bone);font-family:var(--f-body);overflow-x:hidden;overflow-y:auto;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit}
::selection{background:var(--blood-bright);color:#fff}

body::after{content:"";position:fixed;inset:0;z-index:90;pointer-events:none;opacity:.05;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}

#room{position:relative;z-index:1;min-height:100svh;display:flex;flex-direction:column;
  opacity:.26;filter:saturate(.7);transition:opacity .7s var(--ease),filter .7s var(--ease)}
body.broken #room{opacity:1;filter:none}
#room::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(60% 50% at 30% 36%, rgba(176,124,255,.16), transparent 60%),
    radial-gradient(70% 60% at 78% 80%, rgba(179,16,42,.22), transparent 62%),
    radial-gradient(120% 90% at 50% 120%, rgba(94,8,20,.5), transparent 70%),
    var(--ink);
  animation:heart 3.4s ease-in-out infinite}
@keyframes heart{0%,100%{opacity:.85}48%{opacity:1}52%{opacity:.92}}

.plx{position:absolute;inset:0;pointer-events:none;will-change:transform;
  transform:translate3d(calc(var(--px)*var(--d)*1px),calc(var(--py)*var(--d)*1px),0)}

.rhead{position:relative;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:16px clamp(16px,4vw,40px);border-bottom:1px solid rgba(179,16,42,.25)}
.rhead .sig{font-family:var(--f-logo);font-size:clamp(1.1rem,4vw,1.5rem);color:var(--bone);
  -webkit-text-stroke:.5px var(--blood-wet);text-shadow:0 0 12px rgba(179,16,42,.4)}
.rhead .sig b{color:var(--blood-bright)}
.waxrow{display:flex;gap:8px}
.wax{position:relative;width:34px;height:34px;display:grid;place-items:center;cursor:help;border:0;
  background:radial-gradient(circle at 38% 32%,#9c1326,#5e0814 70%);border-radius:50%;
  box-shadow:inset 0 2px 3px rgba(255,150,150,.3),inset 0 -3px 5px rgba(0,0,0,.5),0 3px 8px rgba(0,0,0,.5);
  font-family:var(--f-egg);font-size:.8rem;color:#ffd9de;transition:transform .25s var(--ease)}
.wax::after{content:"SEALED";position:absolute;left:50%;top:118%;transform:translateX(-50%);
  font-family:var(--f-body);font-size:.42rem;letter-spacing:.2em;color:var(--bone-faint);white-space:nowrap;opacity:0;transition:opacity .25s var(--ease)}
.wax:hover{transform:rotate(-7deg) scale(1.12)}
.wax:hover::after{opacity:1}

.rmain{position:relative;flex:1 1 auto;min-height:max(72vh,560px);overflow:hidden}

.shard{position:absolute;pointer-events:none;line-height:.9;white-space:nowrap;mix-blend-mode:screen;
  text-shadow:0 0 18px rgba(179,16,42,.35)}
.sh-logo{font-family:var(--f-logo);color:var(--bone)}
.sh-mono{font-family:var(--f-body);font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--violet)}
.flick{animation:flick 4.5s steps(1) infinite}
@keyframes flick{0%,100%{opacity:.85}41%{opacity:.3}44%{opacity:.9}47%{opacity:.4}73%{opacity:.95}}

.wreck{position:absolute;width:clamp(80px,15vw,150px);aspect-ratio:1;border-radius:50%;pointer-events:none;
  background:
    radial-gradient(circle,#1a0d10 0 16%, transparent 17%),
    repeating-radial-gradient(circle,#0c0809 0 2px,#161012 2px 4px);
  box-shadow:0 10px 30px rgba(0,0,0,.6),inset 0 0 24px rgba(0,0,0,.7);will-change:transform;
  animation:skip 2.6s steps(8) infinite}
.wreck::before{content:"";position:absolute;inset:38%;border-radius:50%;
  background:radial-gradient(circle,var(--blood-bright),var(--blood-deep));box-shadow:0 0 10px rgba(179,16,42,.6)}
.wreck::after{content:"";position:absolute;left:48%;top:-4%;width:4%;height:108%;
  background:linear-gradient(90deg,transparent,#050203 35%,#050203 65%,transparent);transform:rotate(8deg)}
@keyframes skip{0%{transform:rotate(0)}40%{transform:rotate(150deg)}44%{transform:rotate(142deg)}48%{transform:rotate(158deg)}100%{transform:rotate(360deg)}}

.page{position:absolute;width:clamp(150px,29vw,248px);padding:20px 22px 22px;cursor:pointer;border:0;text-align:left;
  background:
    radial-gradient(130% 90% at 82% 8%, rgba(179,16,42,.20), transparent 58%),
    linear-gradient(160deg,var(--paper),var(--paper-2));
  color:var(--inkpage);
  clip-path:polygon(2% 6%,14% 1%,30% 5%,48% 0,66% 4%,82% 1%,98% 7%,96% 30%,99% 52%,95% 74%,98% 92%,84% 97%,66% 93%,48% 99%,30% 94%,12% 98%,3% 90%,6% 70%,1% 48%,5% 26%);
  box-shadow:0 16px 32px rgba(0,0,0,.55),inset 0 2px 0 rgba(255,255,255,.35),inset 0 -10px 18px rgba(120,90,60,.18);
  rotate:var(--rot,0deg);
  transition:transform .3s var(--ease),filter .3s var(--ease),opacity .35s var(--ease)}
.page::before{content:"";position:absolute;right:14%;top:10%;width:26px;height:14px;pointer-events:none;opacity:.5;
  background:url('art/blood.png') center/contain no-repeat;transform:rotate(34deg)}
.page:nth-child(3n+1)::before{opacity:0}
.page .pn{display:block;font-family:var(--f-body);font-size:.5rem;letter-spacing:.22em;color:rgba(36,23,18,.45);margin-bottom:8px}
.page .ln{font-family:var(--f-serif);font-style:italic;font-size:clamp(1.05rem,2.5vw,1.5rem);line-height:1.34}
.page .cue{display:none;margin-top:12px;font-family:var(--f-body);font-style:normal;font-size:.5rem;letter-spacing:.2em;
  text-transform:uppercase;color:var(--blood);opacity:.85}
.page:hover{transform:scale(1.03) translateY(-2px)}
.page.cur{transform:scale(1.06);z-index:5;filter:drop-shadow(0 0 24px rgba(179,16,42,.6));animation:pageBob 2.6s ease-in-out infinite}
.page.cur .pn{color:var(--blood-bright)}
.page.cur .cue{display:block}
.page.cur:hover{transform:scale(1.08) translateY(-2px)}
@keyframes pageBob{0%,100%{transform:scale(1.06) translateY(0)}50%{transform:scale(1.06) translateY(-5px)}}
.page.reading{filter:drop-shadow(0 0 30px rgba(255,39,71,.8))}
.page.read{opacity:.5;filter:grayscale(.45) brightness(.85)}
.page.read::after{content:"";position:absolute;left:9%;right:9%;top:54%;height:2px;background:rgba(179,16,42,.75);transform:rotate(-4deg)}
.page.flinch{animation:flinch .42s}
@keyframes flinch{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.page.tornout{opacity:.2;filter:grayscale(1) brightness(.6)}
.page.tornout::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 46%,#050203 47% 53%,transparent 54%)}

#closing{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);z-index:6;text-align:center;
  font-family:var(--f-egg);font-size:clamp(1.2rem,4vw,2.2rem);color:var(--blood-bright);
  text-shadow:0 0 22px rgba(179,16,42,.55);opacity:0;pointer-events:none;
  transition:opacity .8s var(--ease),transform .8s var(--ease)}
body.read-done #closing{opacity:1;transform:translate(-50%,-50%) scale(1)}

.rfoot{position:relative;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  padding:16px clamp(16px,4vw,40px);border-top:1px solid rgba(179,16,42,.25)}
.rfoot .tag{font-family:var(--f-body);font-size:.5rem;letter-spacing:.24em;text-transform:uppercase;color:var(--bone-faint)}
.slotrow{display:flex;gap:10px}
.slot{width:64px;height:40px;border:1px dashed rgba(179,16,42,.45);display:grid;place-items:center;cursor:help;
  font-family:var(--f-egg);font-size:.7rem;color:var(--blood-wet);transition:transform .25s var(--ease)}
.slot:hover{transform:translateY(-3px) rotate(-2deg)}

#glass{position:fixed;inset:0;z-index:30;pointer-events:none;transition:opacity .12s linear;
  background:
    linear-gradient(115deg,transparent 38%,rgba(255,255,255,.05) 49%,rgba(255,255,255,.10) 50%,rgba(255,255,255,.04) 51%,transparent 62%),
    radial-gradient(130% 120% at 50% 50%,transparent 56%,rgba(0,0,0,.55) 100%)}
body.blackout #glass{opacity:.18}

#cracks{position:fixed;inset:0;z-index:31;pointer-events:none}
#cracks svg{width:100%;height:100%}
#cracks path{fill:none;stroke:rgba(239,230,221,.55);stroke-width:1.4;vector-effect:non-scaling-stroke;
  stroke-dasharray:1;stroke-dashoffset:1;filter:drop-shadow(0 0 3px rgba(255,255,255,.4))}
body.broken #cracks path{animation:crackDraw .75s var(--ease) forwards;animation-delay:var(--cd,0s)}
body.broken #cracks{animation:crackJolt .42s steps(5)}
@keyframes crackDraw{to{stroke-dashoffset:0}}
@keyframes crackJolt{0%,100%{transform:translate(0,0)}20%{transform:translate(-3px,2px)}40%{transform:translate(4px,-2px)}60%{transform:translate(-2px,-1px)}80%{transform:translate(2px,1px)}}

#blood-layer{position:fixed;inset:0;z-index:32;pointer-events:none}
.blood{position:absolute;transform:rotate(var(--r,0deg));filter:drop-shadow(0 2px 6px rgba(60,0,0,.6))}
.blood>i{display:block;width:var(--w,160px);aspect-ratio:1.86;
  background:url('art/blood.png') center/contain no-repeat;opacity:0;transform:scale(.25)}
body.broken .blood>i{animation:bloodBloom .6s cubic-bezier(.2,1.4,.4,1) both;animation-delay:var(--bd,0s)}
@keyframes bloodBloom{0%{opacity:0;transform:scale(.25)}100%{opacity:var(--o,.8);transform:scale(1)}}
.blood .drip{position:absolute;left:var(--dx,50%);top:62%;width:3px;height:0;border-radius:0 0 3px 3px;
  background:linear-gradient(180deg,var(--blood-wet),var(--blood-deep))}
body.broken .blood .drip{animation:drip var(--dd,4s) ease-in infinite;animation-delay:var(--bd,0s)}
@keyframes drip{0%{height:0;opacity:0}10%{opacity:.9}70%{opacity:.8}100%{height:120px;opacity:0}}

#flash{position:fixed;inset:0;z-index:40;pointer-events:none;background:#fff;opacity:0}
body.broken #flash{animation:flash .5s var(--ease)}
@keyframes flash{0%{opacity:0}8%{opacity:.5}100%{opacity:0}}

body.blackout #room{filter:brightness(.04) saturate(0)}

#gate{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:16px;cursor:pointer;
  background:linear-gradient(120deg,rgba(255,255,255,.02) 30%,rgba(255,255,255,.09) 50%,rgba(255,255,255,.02) 70%),
    radial-gradient(120% 110% at 50% 50%,rgba(11,6,8,.35),rgba(5,2,3,.82))}
body.broken #gate{opacity:0;visibility:hidden;pointer-events:none;transition:opacity .5s var(--ease),visibility .5s}
.gt-hand{width:clamp(150px,38vw,260px);filter:drop-shadow(0 0 26px rgba(179,16,42,.6));animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.gt-k{font-family:var(--f-egg);font-size:clamp(1.6rem,7vw,3rem);color:var(--blood-bright);letter-spacing:.03em;
  text-shadow:0 0 20px rgba(179,16,42,.5)}
.gt-s{font-family:var(--f-body);font-size:.62rem;letter-spacing:.28em;text-transform:uppercase;color:var(--bone-dim)}

#glassctl{position:fixed;top:14px;right:14px;z-index:60;display:flex;align-items:center;gap:10px;
  opacity:0;pointer-events:none;transition:opacity .5s var(--ease)}
body.broken #glassctl{opacity:1;pointer-events:auto}
body.warded #glassctl{display:none}
#glassctl button,#glassctl a{font-family:var(--f-body);font-size:.52rem;letter-spacing:.2em;text-transform:uppercase;
  color:var(--bone-dim);background:rgba(5,2,3,.4);border:1px solid rgba(239,230,221,.18);padding:7px 11px;cursor:pointer;
  transition:color .25s var(--ease),border-color .25s var(--ease)}
#glassctl button:hover,#glassctl a:hover{color:var(--bone);border-color:var(--blood-bright)}
.gc-mark{font-family:var(--f-body);font-size:.5rem;letter-spacing:.2em;color:var(--violet);text-shadow:0 0 8px rgba(176,124,255,.5)}

#ward{position:fixed;inset:0;z-index:70;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  background:radial-gradient(80% 70% at 50% 50%,#0b0608,#050203 75%);text-align:center;padding:24px}
body.warded #ward{display:flex}
.wd-crack{position:absolute;left:50%;top:50%;width:1px;height:62vh;background:rgba(239,230,221,.3);
  transform:translate(-50%,-50%) rotate(7deg);box-shadow:0 0 6px rgba(255,255,255,.3)}
.wd-k{position:relative;font-family:var(--f-egg);font-size:clamp(1.6rem,7vw,3rem);color:var(--blood-wet);letter-spacing:.04em}
.wd-s{position:relative;font-family:var(--f-body);font-size:.7rem;letter-spacing:.12em;color:var(--bone-faint);line-height:1.8}
.wd-up{position:relative;margin-top:8px;font-family:var(--f-body);font-size:.56rem;letter-spacing:.24em;text-transform:uppercase;
  color:var(--bone-dim);border:1px solid rgba(239,230,221,.2);padding:9px 16px;transition:color .25s var(--ease),border-color .25s var(--ease)}
.wd-up:hover{color:var(--bone);border-color:var(--blood-bright)}

@media(max-width:760px){
  .rmain{overflow:visible;min-height:auto;padding:26px 0 44px}
  .plx{display:none}
  .page{position:relative;width:82%;left:auto!important;top:auto!important;margin:-4px auto 30px}
  .page:nth-of-type(odd){margin-left:7%}
  .page:nth-of-type(even){margin-left:auto;margin-right:7%}
  .page.cur{transform:scale(1.02)}
  .page.cur:hover{transform:scale(1.04)}
  @keyframes pageBob{0%,100%{transform:scale(1.02) translateY(0)}50%{transform:scale(1.02) translateY(-4px)}}
  #closing{position:relative;left:auto;top:auto;transform:none;margin:36px auto 12px}
  body.read-done #closing{transform:none}
}

@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition-duration:.01ms!important}
  #room{opacity:1;filter:none}
  .blood>i{opacity:var(--o,.8);transform:scale(1)}
  #cracks path{stroke-dashoffset:0}
}
</style>
</head>
<body>

<div id="room">
  <header class="rhead">
    <span class="sig">Nilou<b>·</b>verse</span>
    <div class="waxrow" aria-label="sealed rewards">
      <button class="wax" type="button" title="reward I — sealed">I</button>
      <button class="wax" type="button" title="reward II — sealed">II</button>
      <button class="wax" type="button" title="reward III — sealed">III</button>
    </div>
  </header>

  <main class="rmain">
    <div class="plx" style="--d:11" aria-hidden="true">
      <span class="shard sh-logo flick" style="top:46%;left:40%;font-size:clamp(2.4rem,10vw,6rem);transform:rotate(3deg)">BENEATH</span>
      <div class="wreck" style="top:16%;left:70%"></div>
      <div class="wreck" style="top:64%;left:80%;width:clamp(60px,11vw,108px)"></div>
      <span class="shard sh-mono flick" style="top:6%;left:44%;font-size:.55rem;transform:rotate(-2deg)">she kept the pieces</span>
    </div>

    <button class="page" type="button" style="top:8%;left:5%;--rot:-7deg" aria-label="page one">
      <span class="pn">· 01</span>
      <span class="ln">the first verse bleeds through the wall</span>
      <span class="cue">▸ read aloud</span>
    </button>
    <button class="page" type="button" style="top:6%;left:58%;--rot:5deg" aria-label="page two">
      <span class="pn">· 02</span>
      <span class="ln">she was quiet, once — before the floor learned her name</span>
      <span class="cue">▸ read aloud</span>
    </button>
    <button class="page" type="button" style="top:38%;left:36%;--rot:-3deg" aria-label="page three">
      <span class="pn">· 03</span>
      <span class="ln">every door you opened was a mouth</span>
      <span class="cue">▸ read aloud</span>
    </button>
    <button class="page" type="button" style="top:60%;left:6%;--rot:6deg" aria-label="page four">
      <span class="pn">· 04</span>
      <span class="ln">you kept counting fingers like they were rosary beads</span>
      <span class="cue">▸ read aloud</span>
    </button>
    <button class="page" type="button" style="top:56%;left:60%;--rot:-5deg" aria-label="page five">
      <span class="pn">· 05</span>
      <span class="ln">the gentle thing was never gentle — only patient</span>
      <span class="cue">▸ read aloud</span>
    </button>
    <button class="page" type="button" style="top:30%;left:74%;--rot:8deg" aria-label="page six">
      <span class="pn">· 06</span>
      <span class="ln">and now the book is open, and the book is you</span>
      <span class="cue">▸ read aloud</span>
    </button>

    <p id="closing">the book is empty now — but she isn't.</p>
  </main>

  <footer class="rfoot">
    <span class="tag">the surface, far above</span>
    <div class="slotrow" aria-label="sealed rewards">
      <span class="slot" title="sealed">✦</span>
      <span class="slot" title="sealed">✦</span>
      <span class="slot" title="sealed">✦</span>
    </div>
  </footer>
</div>

<div id="glass" aria-hidden="true"></div>

<svg id="cracks" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
  <path pathLength="1" style="--cd:0s"    d="M38 52 L20 30 L8 18"/>
  <path pathLength="1" style="--cd:.05s" d="M38 52 L30 12 L26 2"/>
  <path pathLength="1" style="--cd:.1s"  d="M38 52 L52 22 L60 6"/>
  <path pathLength="1" style="--cd:.15s" d="M38 52 L70 34 L92 26"/>
  <path pathLength="1" style="--cd:.2s"  d="M38 52 L74 56 L96 60"/>
  <path pathLength="1" style="--cd:.25s" d="M38 52 L60 80 L72 98"/>
  <path pathLength="1" style="--cd:.3s"  d="M38 52 L40 84 L36 99"/>
  <path pathLength="1" style="--cd:.35s" d="M38 52 L18 64 L4 70"/>
  <path pathLength="1" style="--cd:.18s" d="M30 12 L18 16"/>
  <path pathLength="1" style="--cd:.22s" d="M52 22 L66 18"/>
  <path pathLength="1" style="--cd:.28s" d="M70 34 L80 44"/>
  <path pathLength="1" style="--cd:.34s" d="M60 80 L50 90"/>
  <path pathLength="1" style="--cd:.4s"  d="M18 64 L24 78"/>
</svg>

<div id="blood-layer" aria-hidden="true">
  <span class="blood" style="top:7%;left:5%;--r:-18deg;--w:170px;--o:.9;--bd:.1s"><i></i></span>
  <span class="blood" style="top:21%;left:76%;--r:24deg;--w:130px;--o:.7;--bd:.22s"><i></i></span>
  <span class="blood" style="top:60%;left:12%;--r:8deg;--w:200px;--o:.85;--bd:.16s"><i></i><span class="drip" style="--dx:42%;--dd:4.2s;--bd:.7s"></span></span>
  <span class="blood" style="top:68%;left:68%;--r:-30deg;--w:150px;--o:.8;--bd:.3s"><i></i><span class="drip" style="--dx:58%;--dd:5s;--bd:1s"></span></span>
  <span class="blood" style="top:39%;left:45%;--r:140deg;--w:110px;--o:.5;--bd:.4s"><i></i></span>
  <span class="blood" style="top:83%;left:38%;--r:6deg;--w:160px;--o:.72;--bd:.34s"><i></i></span>
</div>

<div id="flash" aria-hidden="true"></div>

<div id="gate" role="button" tabindex="0" aria-label="press the glass to descend">
  <img class="gt-hand" src="art/handprint.png" alt="" draggable="false">
  <p class="gt-k">press the glass</p>
  <p class="gt-s">it is warm on the other side</p>
</div>

<div id="glassctl">
  <button id="muteBtn" type="button" aria-pressed="false" aria-label="mute the chamber" hidden><span id="muteIco">♪</span> sound</button>
  <a href="index.html" aria-label="return to the surface">↑ surface</a>
  <span class="gc-mark" aria-hidden="true">● marked</span>
</div>

<div id="ward" role="alertdialog" aria-label="sealed">
  <div class="wd-crack" aria-hidden="true"></div>
  <p class="wd-k">the floor is sealed</p>
  <p class="wd-s">you did not come from below.<br>the glass stays whole for you.</p>
  <a class="wd-up" href="index.html">↑ return to the surface</a>
</div>

<script>
(function(){
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var WON = (function(){ try{ return localStorage.getItem('nv_puzzle_won')==='1'; }catch(e){ return false; } })();
  if(!WON){ document.body.classList.add('warded'); return; }

  if(!reduce){
    addEventListener('pointermove', function(e){
      var r = document.documentElement.style;
      r.setProperty('--px', ((e.clientX/innerWidth)-.5)*2);
      r.setProperty('--py', ((e.clientY/innerHeight)-.5)*2);
    }, {passive:true});
  }

  var pageEls = Array.prototype.slice.call(document.querySelectorAll('.page'));
  var unlocked = false, reading = false, broken = false;
  var gate = document.getElementById('gate');

  function flinch(el){ el.classList.remove('flinch'); void el.offsetWidth; el.classList.add('flinch'); setTimeout(function(){ el.classList.remove('flinch'); }, 420); }
  function advance(i){
    var nx = i + 1;
    if(nx < pageEls.length) pageEls[nx].classList.add('cur');
    else document.body.classList.add('read-done');
  }
  function readPage(i){
    if(reading || i < 0 || i >= pageEls.length) return;
    var el = pageEls[i];
    var played = Audio.playPage(i, function(missing){
      reading = false;
      el.classList.remove('cur','reading');
      el.classList.add(missing ? 'tornout' : 'read');
      advance(i);
    });
    if(!played){ reading = false; el.classList.remove('cur'); el.classList.add('tornout'); advance(i); return; }
    reading = true;
    el.classList.add('reading');
  }
  pageEls.forEach(function(el,i){
    el.addEventListener('click', function(){
      if(!unlocked) return;
      if(el.classList.contains('cur')) readPage(i);
      else flinch(el);
    });
  });

  function descend(){
    if(broken) return; broken = true;
    document.body.classList.add('broken');
    Audio.start(function(){
      unlocked = true;
      if(pageEls[0]) pageEls[0].classList.add('cur');
    });
  }
  gate.addEventListener('click', descend);
  gate.addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); descend(); } });
})();

var Audio = (function(){
  var WON = (function(){ try{ return localStorage.getItem('nv_puzzle_won')==='1'; }catch(e){ return false; } })();
  if(!WON) return { start:function(){}, playPage:function(){ return false; } };

  /* intro's silence is baked into the file at 2-4s: lights only, no gain duck */
  var INTRO_FX = [{ at:2, dur:2, lights:true, duck:false }];
  /* war's break is imposed here (lights + gain); move WAR_BREAK to the exact second after you hear it */
  var WAR_BREAK = 2.0;
  var TRACK = {
    intro: 'sound/intro.mp3',
    pages: [
      { src:'sound/war.mp3', fx:[{ at:WAR_BREAK, dur:1.0, lights:true, duck:true }] },
      { src:'sound/nz1.mp3', fx:[] },
      { src:'sound/nz2.mp3', fx:[] },
      { src:'sound/nz3.mp3', fx:[] },
      { src:'sound/nz4.mp3', fx:[] },
      { src:'sound/nz5.mp3', fx:[] }
    ]
  };

  var ctx=null, master=null, comp=null, raw={}, buf={}, muted=false, any=false;
  var muteBtn=document.getElementById('muteBtn'), muteIco=document.getElementById('muteIco');
  function noop(){}

  function ensureCtx(){
    if(ctx) return;
    try{ ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
    comp = ctx.createDynamicsCompressor();
    comp.threshold.value=-14; comp.knee.value=20; comp.ratio.value=6;
    master = ctx.createGain(); master.gain.value = muted?0:1;
    master.connect(comp); comp.connect(ctx.destination);
  }
  function decode(ab){
    try{ var r=ctx.decodeAudioData(ab.slice(0)); if(r&&typeof r.then==='function') return r; }catch(e){}
    return new Promise(function(res,rej){ try{ ctx.decodeAudioData(ab.slice(0),res,rej); }catch(e){ rej(); } });
  }
  function decodeOne(src, cb){
    if(!src){ buf[src]=null; if(cb)cb(); return; }
    if(buf[src]!==undefined){ if(cb)cb(); return; }
    if(raw[src]===null || raw[src]===undefined){ buf[src]=null; if(cb)cb(); return; }
    decode(raw[src]).then(function(b){ buf[src]=b; showMute(); if(cb)cb(); })
      .catch(function(){ buf[src]=null; if(cb)cb(); });
  }
  function showMute(){ if(any) return; any=true; if(muteBtn) muteBtn.hidden=false; }
  function toggleMute(){
    if(!ctx||!master) return; muted=!muted;
    master.gain.setTargetAtTime(muted?0:1, ctx.currentTime, 0.05);
    if(muteBtn){ muteBtn.setAttribute('aria-pressed', muted?'true':'false'); if(muteIco) muteIco.textContent = muted?'✕':'♪'; }
  }
  if(muteBtn) muteBtn.addEventListener('click', toggleMute);

  /* plays one buffer with its fx timeline; onEnd(true) on finish, onEnd(false) if the clip is missing */
  function playBuf(src, baseGain, fx, onEnd){
    var b = buf[src];
    if(!b){ if(onEnd) onEnd(false); return false; }
    var s = ctx.createBufferSource(); s.buffer = b;
    var g = ctx.createGain(); g.gain.value = baseGain;
    s.connect(g); g.connect(master);
    var t0 = ctx.currentTime;
    try{ s.start(t0); }catch(e){ if(onEnd) onEnd(false); return false; }
    showMute();
    var applied = fx.map(function(){ return false; });
    var raf = 0;
    function tick(){
      var el = ctx.currentTime - t0;
      for(var i=0;i<fx.length;i++){
        var w = fx[i], inW = el >= w.at && el < w.at + w.dur;
        if(inW && !applied[i]){
          applied[i]=true;
          if(w.lights) document.body.classList.add('blackout');
          if(w.duck) g.gain.setTargetAtTime(0, ctx.currentTime, 0.02);
        } else if(!inW && applied[i]){
          applied[i]=false;
          if(w.lights) document.body.classList.remove('blackout');
          if(w.duck) g.gain.setTargetAtTime(baseGain, ctx.currentTime, 0.02);
        }
      }
      if(el < (b.duration||0) + 0.05) raf = requestAnimationFrame(tick);
    }
    if(fx.length) raf = requestAnimationFrame(tick);
    s.onended = function(){
      if(raf) cancelAnimationFrame(raf);
      for(var i=0;i<fx.length;i++){ if(applied[i] && fx[i].lights) document.body.classList.remove('blackout'); }
      try{ g.disconnect(); }catch(e){}
      if(onEnd) onEnd(true);
    };
    return true;
  }

  function start(onDone){
    ensureCtx();
    if(!ctx){ if(onDone) onDone(); return; }
    var go = function(){
      TRACK.pages.forEach(function(p){ decodeOne(p.src, noop); });
      decodeOne(TRACK.intro, function(){
        showMute();
        if(buf[TRACK.intro]) playBuf(TRACK.intro, 1.0, INTRO_FX, function(){ if(onDone) onDone(); });
        else if(onDone) setTimeout(onDone, 700);
      });
    };
    if(ctx.state==='suspended'){ var pr=ctx.resume(); if(pr&&pr.then) pr.then(go,go); else go(); }
    else go();
  }
  function playPage(i, onEnd){
    var p = TRACK.pages[i];
    if(!p) { if(onEnd) onEnd(true); return false; }
    var ok = playBuf(p.src, 0.95, p.fx||[], function(played){ if(onEnd) onEnd(!played); });
    if(!ok){ if(onEnd) onEnd(true); }
    return ok;
  }

  (function preload(){
    var all = TRACK.pages.map(function(p){ return p.src; }); all.push(TRACK.intro);
    all.forEach(function(src){
      if(!src){ raw[src]=null; return; }
      fetch(src).then(function(r){ return r.ok ? r.arrayBuffer() : Promise.reject(); })
        .then(function(ab){ raw[src]=ab; }).catch(function(){ raw[src]=null; });
    });
  })();

  return { start:start, playPage:playPage };
})();
</script>
</body>
</html>
